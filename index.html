<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor de notas</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Gestor de notas</h1>
  <p class="sub">Registra estudiantes y actividades. El promedio ponderado y el estado se calculan solos.</p>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <label>Nuevo estudiante
      <input id="newStudent" placeholder="Nombre completo" autocomplete="off">
    </label>
    <button class="main" id="addStudent">Agregar estudiante</button>
    <button id="addAct">Agregar actividad</button>
    <label>Nota máxima <input id="max" type="number" min="1" step="0.5" style="width:90px"></label>
    <label>Nota para aprobar <input id="pass" type="number" min="0" step="0.1" style="width:90px"></label>
  </div>

  <div class="wrap"><table id="tbl"></table></div>
  <p class="note" id="wnote"></p>
  <p class="note">Los datos se guardan en este navegador. Si dejas una nota vacía, no cuenta en el promedio.</p>
</main>

<script src="app.js"></script>
</body>
</html>
